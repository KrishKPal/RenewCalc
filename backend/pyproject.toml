[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renewcalc-feasibility"
version = "0.1.0"
description = "RenewCalc solar feasibility backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.7,<3",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pvlib>=0.11,<1",
  "scipy>=1.12,<2", "httpx>=0.27,<1", "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
